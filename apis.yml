aid: rain-financial
name: Rain Financial
description: >-
  Rain is a Middle East and North Africa (MENA) cryptocurrency exchange and digital-asset
  platform, operated through Rain Financial Inc. and its Bahrain entity Rain Management W.L.L.
  Founded in 2017 by Abdullah Almoaiqel, AJ Nelson, Joseph Dallago, and Yehia Badawy, Rain
  became the first crypto-asset company accepted into the Central Bank of Bahrain (CBB)
  regulatory sandbox and, in 2019, the first CBB-licensed crypto-asset service provider in
  the region. Rain Trading Limited later received approval from Abu Dhabi Global Market's
  Financial Services Regulatory Authority (FSRA) to expand across the UAE. Rain lets retail
  and institutional customers buy, sell, store, and manage Bitcoin, Ethereum, and other
  cryptocurrencies against multiple fiat currencies, with a Rain Pro offering for advanced
  traders and the majority of customer assets held in multi-signature cold storage. The
  company raised seed, Series A, and a $110M Series B (Paradigm, Kleiner Perkins), and is a
  portfolio company of 500 Global.
